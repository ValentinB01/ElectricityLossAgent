data:
  processed_dir: ../../data/processed
experiment:
  seed: 42
  device: auto
  output_dir: ../../outputs
  model_dir: ../../experiments
  cpu_threads: 8
  num_workers: 0  # portable on Windows; NPY files are memory mapped
models:
  lightgbm:
    enabled: true
    tuning_enabled: false
    tuning_trials: 20
    early_stopping_rounds: 100
    compare_class_weights: true
    weighted_loss: true
    tuning_space:
      learning_rate: [float, 0.01, 0.1, true]
      num_leaves: [int, 15, 63, false]
      max_depth: [int, 4, 12, false]
      min_child_samples: [int, 15, 100, false]
      subsample: [float, 0.6, 1.0, false]
      colsample_bytree: [float, 0.6, 1.0, false]
      reg_alpha: [float, 0.0001, 3.0, true]
      reg_lambda: [float, 0.1, 10.0, true]
    params:
      n_estimators: 1500
      learning_rate: 0.03
      num_leaves: 31
      max_depth: -1
      min_child_samples: 30
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
  xgboost:
    enabled: true
    tuning_enabled: false
    tuning_trials: 20
    early_stopping_rounds: 100
    compare_class_weights: true
    weighted_loss: true
    tuning_space:
      learning_rate: [float, 0.01, 0.1, true]
      max_depth: [int, 3, 8, false]
      min_child_weight: [float, 1.0, 15.0, false]
      subsample: [float, 0.6, 1.0, false]
      colsample_bytree: [float, 0.6, 1.0, false]
      gamma: [float, 0.0, 2.0, false]
      reg_alpha: [float, 0.0001, 3.0, true]
      reg_lambda: [float, 0.1, 10.0, true]
    params:
      n_estimators: 1500
      learning_rate: 0.03
      max_depth: 5
      min_child_weight: 3
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      tree_method: hist
  cnn1d:
    enabled: true
    batch_size: 128
    max_epochs: 100
    learning_rate: 0.001
    weight_decay: 0.0001
    early_stopping_patience: 12
    dropout: 0.3
    weighted_loss: true
    channels: [32, 64, 128]
    kernels: [7, 5, 3]
    gradient_clip: 1.0
    min_delta: 0.0001
    scheduler_patience: 4
    mixed_precision: true
  hybrid:
    enabled: true
    batch_size: 128
    max_epochs: 100
    learning_rate: 0.001
    weight_decay: 0.0001
    early_stopping_patience: 12
    dropout: 0.3
    weighted_loss: true
    channels: [32, 64, 128]
    kernels: [7, 5, 3]
    gradient_clip: 1.0
    min_delta: 0.0001
    scheduler_patience: 4
    mixed_precision: true
evaluation:
  primary_metric: average_precision
  default_threshold: 0.5
  optimize_threshold: true
  threshold_objective: f1  # f1 or recall_at_precision
  minimum_precision: 0.70
  threshold_start: 0.01
  threshold_stop: 0.99
  threshold_step: 0.01
  top_k_percentages: [1, 5, 10, 20]
  bootstrap_enabled: false
  bootstrap_iterations: 1000
visualization:
  generate_static: true
  generate_interactive: true
  save_png: true
  save_svg: true
  dpi: 300
  generate_consumer_examples: true
  examples_per_category: 5
  dashboard_table_limit: 500
