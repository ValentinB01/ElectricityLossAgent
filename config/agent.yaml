# LLM Agent configuration
provider: "gemini"
model: "gemini/gemini-2.5-flash"
as_of: "2026-11-08"

# Limits (design D15)
limits:
  max_iterations: 6
  max_tool_calls: 12
  timeout_seconds: 60
  max_tokens: 4096

# Grounding check parameters (design D6)
grounding:
  tolerance: 0.05
  small_count_exemption: 10

# Action gate settings (design D7)
action:
  ttl_seconds: 3600

# Server settings (design D12, D15)
server:
  host: "127.0.0.1"
  port: 8000

# Per-tool backend map (fixture or live). "live" means real models and data answer (src/agent/backends/live.py);
# "fixture" means the demo pack in src/agent/fixtures/demo_week. The consumer tools stay on fixture until the
# SGCC model is connected. AGENT_BACKENDS=fixture forces every tool to fixture (tests, offline demo).
backends:
  get_weather_forecast: "live"
  predict_expected_production: "live"
  detect_underperformance: "live"
  compute_cost_map: "live"
  list_tasks: "live"
  optimize_maintenance: "live"
  predict_expected_consumption: "fixture"
  score_households: "fixture"
  build_inspection_list: "fixture"
  loss_overview: "live"
  explain: "live"
  update_from_field_report: "live"
  create_work_orders: "live"
  send_alert: "live"
  promote_schedule: "live"

