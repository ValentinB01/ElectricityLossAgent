<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 860" width="1340" height="860" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Two loss modules, one agent</title>
  <desc id="d">Producers: SCADA and inverter data feed expected production (M1), which feeds underperformance (M2). Weather forecast feeds downtime cost (M4). M2, M4, revisions and crews feed the optimizer. Consumers: monthly consumption feeds expected consumption (C1), which feeds anomaly detection (C2), which feeds the inspection queue. The optimizer and queue feed the LLM agent.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c9c9bd"/></marker>
    <style>
      .b{fill:#fff;stroke:#c9c9bd;stroke-width:2}
      .g{fill:#ececea;stroke:#c9c9bd;stroke-width:2}
      .l{stroke:#c9c9bd;stroke-width:2;fill:none;marker-end:url(#a)}
      .h{font-size:24px;font-weight:600;fill:#111;text-anchor:middle}
      .s{font-size:20px;fill:#555;text-anchor:middle}
      .sec{font-size:20px;font-weight:600;fill:#555}
    </style>
  </defs>
  <rect width="1340" height="860" fill="#fff"/>
  <text x="43" y="60" font-size="28" font-weight="600" fill="#111">Two loss modules, one agent</text>

  <text class="sec" x="43" y="120">Producers · PPC Renewables</text>
  <rect class="b" x="43" y="141" width="264" height="85" rx="12"/><text class="h" x="175" y="192">SCADA, inverter</text>
  <rect class="b" x="354" y="141" width="318" height="85" rx="12"/><text class="h" x="513" y="178">Expected production</text><text class="s" x="513" y="208">M1</text>
  <rect class="b" x="354" y="248" width="318" height="85" rx="12"/><text class="h" x="513" y="285">Underperformance</text><text class="s" x="513" y="315">M2 · cause, MWh/day</text>
  <rect class="b" x="43" y="354" width="264" height="85" rx="12"/><text class="h" x="175" y="405">Weather forecast</text>
  <rect class="b" x="354" y="354" width="318" height="85" rx="12"/><text class="h" x="513" y="391">Downtime cost per hour</text><text class="s" x="513" y="421">M4 · M1 on the forecast</text>
  <rect class="g" x="43" y="460" width="264" height="85" rx="12"/><text class="h" x="175" y="511">Revisions, crews</text>
  <rect class="b" x="718" y="141" width="248" height="404" rx="12"/>
  <text class="h" x="842" y="312">Optimizer</text><text class="s" x="842" y="352">risk × cost</text><text class="s" x="842" y="381">cheap windows</text><text class="s" x="842" y="410">grouping with revisions</text>

  <path class="l" d="M307 183H352"/><path class="l" d="M513 226V246"/><path class="l" d="M672 290H716"/>
  <path class="l" d="M307 396H352"/><path class="l" d="M672 396H716"/><path class="l" d="M307 502H716"/>

  <text class="sec" x="43" y="601">Consumers · Rețele Electrice</text>
  <rect class="b" x="43" y="622" width="264" height="85" rx="12"/><text class="h" x="175" y="659" style="font-size:21px">Monthly consumption</text><text class="s" x="175" y="689">per household</text>
  <rect class="b" x="354" y="622" width="318" height="85" rx="12"/><text class="h" x="513" y="659">Expected consumption</text><text class="s" x="513" y="689">C1 · season, neighbours</text>
  <rect class="b" x="354" y="728" width="318" height="85" rx="12"/><text class="h" x="513" y="765">Anomaly, theft</text><text class="s" x="513" y="795">C2 · P(theft), kWh/month</text>
  <rect class="b" x="718" y="622" width="248" height="191" rx="12"/>
  <text class="h" x="842" y="688">Inspection queue</text><text class="s" x="842" y="733">P(theft) × kWh</text><text class="s" x="842" y="762">crews per day</text>

  <path class="l" d="M307 664H352"/><path class="l" d="M513 707V726"/><path class="l" d="M672 770H716"/>

  <rect x="1011" y="141" width="291" height="672" rx="16" fill="#e3edf8" stroke="#2a7bd8" stroke-width="3"/>
  <text class="h" x="1156" y="266">LLM agent</text>
  <text class="s" x="1156" y="311">calls tools</text><text class="s" x="1156" y="343">what-if scenarios</text><text class="s" x="1156" y="375">explains decisions</text>
  <text class="h" x="1156" y="462" font-size="21">Outputs</text>
  <text class="s" x="1156" y="499">maintenance calendar</text><text class="s" x="1156" y="531">inspection list</text><text class="s" x="1156" y="563">loss view</text><text class="s" x="1156" y="595">alerts</text>

  <path class="l" d="M966 343H1009"/><path class="l" d="M966 717H1009"/>
</svg>
